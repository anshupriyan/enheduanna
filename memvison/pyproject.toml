[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memvision"
version = "0.1.0"
description = "Local-first continuous desktop memory capture, OCR, and MCP server for AI agents"
readme = "README.md"
authors = [{ name = "memvision team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mss>=10.2.0",
    "pillow>=10.0.0",
    "imagehash>=4.3.1",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "pywin32>=306",
    "uiautomation>=2.0.19",
    "winrt-Windows.Media.Ocr>=4.0.0",
    "winrt-Windows.Graphics.Imaging>=4.0.0",
    "winrt-Windows.Storage.Streams>=4.0.0",
    "winrt-Windows.Globalization>=4.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
memvision = "memvision.main:main"

[tool.setuptools.packages.find]
where = ["src"]
